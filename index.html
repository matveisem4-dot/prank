<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Печать из HTML</title>
</head>
<body>
    <button onclick="printViaBluetooth()">Распечатать текст</button>

    <script>
    async function printViaBluetooth() {
    try {
        console.log("Запуск поиска устройств...");
        
        // 1. Снимаем фильтры и разрешаем показ ВСЕХ устройств вокруг
        // Но при этом ОБЯЗАТЕЛЬНО указываем сервисы, к которым планируем обращаться
        const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
                '000018f0-0000-1000-8000-00805f9b34fb', // Стандартный сервис принтеров 1
                '0000ff00-0000-1000-8000-00805f9b34fb', // Сервис для многих китайских плат
                '49535343-fe7d-4ae5-8fa9-9fafd205e455'  // Популярный чипсет ISSC
            ]
        });

        console.log("Устройство выбрано:", device.name);

        // 2. Подключение к принтеру
        const server = await device.gatt.connect();
        
        // Пытаемся найти первичный сервис из списка поддерживаемых
        let service;
        try {
            service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        } catch(e) {
            // Если первый UUID не подошел, пробуем альтернативный китайский
            service = await server.getPrimaryService('0000ff00-0000-1000-8000-00805f9b34fb');
        }
        
        const characteristics = await service.getCharacteristics();
        // Берем первую характеристику, которая поддерживает запись (WRITE)
        const characteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

        if (!characteristic) {
            throw new Error("Не найдена характеристика для отправки данных.");
        }

        // 3. Отправка тестовых байтов (Печать)
        const initCmd = new Uint8Array([0x1B, 0x40]); // ESC @ (Инициализация)
        const textData = new TextEncoder().encode("Hello from HTML!\n\n\n");

        await characteristic.writeValue(initCmd);
        await characteristic.writeValue(textData);

        alert("Успешно распечатано!");

    } catch (error) {
        console.error("Детали ошибки:", error);
        alert("Ошибка: " + error.message);
    }
}
    </script>
</body>
</html>
