<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Внимание! Ошибка системы</title>
    <style>
        body { background: #000; color: #f00; text-align: center; font-family: sans-serif; padding-top: 50px; }
        button { width: 80%; height: 200px; font-size: 30px; background: #222; color: #fff; border: 5px solid #f00; cursor: pointer; }
    </style>
</head>
<body>
    <h1></h1>
    <p></p>
    
    <button onclick="playHard()">ОЧИСТИТЬ</button>

    <audio id="audio" loop>
        <source src="https://soundinstants.com/ru/sound/stony-777" type="audio/mpeg">
    </audio>

    <script>
        function playHard() {
            var snd = document.getElementById("audio");
            snd.volume = 1.0; // Максимальная громкость в плеере
            snd.play();
            
            // Визуальный эффект для паники
            document.body.style.backgroundColor = "white";
            setInterval(function(){
                document.body.style.backgroundColor = 
                (document.body.style.backgroundColor == 'white' ? 'red' : 'white');
            }, 100);
        }
    </script>
</body>
</html>
