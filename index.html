<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Service</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Та самая круглая кнопка без надписей */
        .btn {
            width: 200px;
            height: 200px;
            background-color: #333;
            border: 5px solid #444;
            border-radius: 50%;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s;
        }
        .btn:active {
            background-color: #555;
        }
    </style>
</head>
<body>

    <button class="btn" onclick="boostAndPlay()"></button>

    <audio id="prankAudio" loop>
        <source src="https://soundinstants.com/storage/sounds/stony-777.mp3" type="audio/mpeg">
    </audio>

    <script>
        function boostAndPlay() {
            const audio = document.getElementById('prankAudio');
            
            // Выкручиваем громкость в плеере на 1.0 (максимум)
            audio.volume = 1.0; 
            
            // Запускаем воспроизведение
            audio.play().catch(e => console.log("Ошибка воспроизведения:", e));
            
            // Можно добавить визуальный эффект после нажатия, чтобы было понятно, что сработало
            document.querySelector('.btn').style.borderColor = "#ff0000";
        }
    </script>
</body>
</html>
