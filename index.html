<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Печать из HTML</title>
</head>
<body>
    <button onclick="printViaBluetooth()">Распечатать текст</button>

    <script>
    async function printViaBluetooth() {
        try {
            // 1. Запрашиваем Bluetooth-устройство (ищем стандартный протокол печати)
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }] // Стандартный UUID для принтеров
            });

            // 2. Подключаемся к серверу GATT
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
            
            // Получаем характеристику для записи данных
            const characteristics = await service.getCharacteristics();
            const characteristic = characteristics[0]; 

            // 3. Формируем данные (Команда ESC/POS + текст)
            const encoder = new TextEncoder('cp866'); // Кодировка для русского языка
            
            // Инициализация принтера (\x1b\x40) и текст с переносом строки (\n)
            const initCmd = new Uint8Array([0x1B, 0x40]);
            const textData = new TextEncoder().encode("Hello World!\nTest Print\n\n\n");

            // 4. Отправляем на принтер
            await characteristic.writeValue(initCmd);
            await characteristic.writeValue(textData);

            alert("Данные успешно отправлены на печать!");
        } catch (error) {
            console.error(error);
            alert("Ошибка подключения или печати: " + error.message);
        }
    }
    </script>
</body>
</html>
